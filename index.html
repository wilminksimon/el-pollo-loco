<!DOCTYPE html>
<html translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/responsive.css">
    <title>El Pollo Loco</title>
    <link rel="icon" type="image/png" href="img/6_salsa_bottle/salsa_bottle.png">
    <script src="script.js"></script>
    <script src="js/models/drawable-object.class.js"></script>
    <script src="js/models/movable-object.class.js"></script>
    <script src="js/models/character.class.js"></script>
    <script src="js/models/chicken.class.js"></script>
    <script src="js/models/chicken-small.class.js"></script>
    <script src="js/models/cloud.class.js"></script>
    <script src="js/models/coin.class.js"></script>
    <script src="js/models/bottle.class.js"></script>
    <script src="js/models/statusbar-health.class.js"></script>
    <script src="js/models/statusbar-bottle.class.js"></script>
    <script src="js/models/statusbar-coin.class.js"></script>
    <script src="js/models/statusbar-endboss.class.js"></script>
    <script src="js/models/world.class.js"></script>
    <script src="js/models/background-object.class.js"></script>
    <script src="js/models/keyboard.class.js"></script>
    <script src="js/models/level.class.js"></script>
    <script src="js/models/throwable-object.class.js"></script>
    <script src="js/models/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>

</head>

<body>


    <div id="rotate-message">
        Please rotate your device to landscape mode.
    </div>

    <h1>El Pollo Loco</h1>


    <div id="game-container">
        <div id="startScreen">
            <div class="control-help">
                <button onclick="showControls()"><img src="img/9_intro_outro_screens/ui/control.svg"
                        alt="Controls"></button>
                <button onclick="showHelp()"><img src="img/9_intro_outro_screens/ui/info.svg" alt="Help"></button>
            </div>

            <div class="start-mute">
                <button onclick="startGame()">Start</button>
                <button onclick="toggleMute()" id="mute-button"><img src="img/9_intro_outro_screens/ui/volume-on.svg"
                        alt="Mute"></button>
            </div>
        </div>




        <canvas id="canvas" width="720" height="480"></canvas>
        <button onclick="toggleMute()" id="game-mute-button"><img src="img/9_intro_outro_screens/ui/volume-on.svg"
                alt="Mute"></button>

        <div id="game-over-screen" class="game-over-screen d-none">
            <h2><img src="img/You won, you lost/Game Over.png" alt="Game Over"></h2>
            <button onclick="restartGame()">Erneut spielen</button>
            <button onclick="goToStartScreen()">Startbildschirm</button>
        </div>
        <div id="win-screen" class="game-over-screen d-none">
            <h2><img src="img/You won, you lost/You win B.png" alt="You Win"></h2>
            <button onclick="restartGame()">Erneut spielen</button>
            <button onclick="goToStartScreen()">Startbildschirm</button>
        </div>
    </div>

    <div id="touch-controls">
        <div class="touch-left">
            <button id="touch-left">◀</button>
            <button id="touch-right">▶</button>
        </div>

        <div class="touch-right">
            <button id="touch-jump">▲</button>
            <button id="touch-throw">🍾</button>
        </div>
    </div>


    <!-- Dialog für die Steuerung -->
    <div id="controls-dialog" class="dialog-overlay d-none" onclick="closeDialog('controls-dialog')">
        <div class="dialog-box" onclick="event.stopPropagation()">
            <button class="dialog-close" onclick="closeDialog('controls-dialog')">×</button>
            <h2>Steuerung</h2>
            <p><strong>◀ / ▶</strong> - Nach links und rechts laufen</p>
            <p>
                <strong class="keyboard-jump">Leertaste</strong>
                <span class="touch-jump">▲</span>
                - Springen
            </p>
            <p>
                <strong class="keyboard-throw">D</strong>
                <span class="touch-throw">🍾</span>
                - Flasche werfen
            </p>
        </div>
    </div>

    <!-- Dialog für das Impressum -->
    <div id="imprint-dialog" class="dialog-overlay d-none" onclick="closeDialog('imprint-dialog')">
        <div class="dialog-box" onclick="event.stopPropagation()">
            <button class="dialog-close" onclick="closeDialog('imprint-dialog')">×</button>
            <h2>Impressum</h2>
            <p>Simon Wilmink</p>
            <p>Haselünner Straße 30</p>
            <p>49777 Klein Berßen</p>
        </div>
    </div>





</body>

</html>
